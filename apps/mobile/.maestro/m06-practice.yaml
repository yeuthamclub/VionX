# M06 main path: a Grade 2 child opens Learn, starts the first topic of Toán 2 (a diagnostic of 10
# items), answers by tapping only (option buttons, the on-screen number pad, tap-to-order), hears
# every item read aloud in Vietnamese, takes a hint, reports a question, and reaches the summary.
# Then the parent sees the per-skill states.
# Which item types appear depends on the library, so the answer step is a loop of optional taps:
# whatever control is on screen gets one tap. Right or wrong does not matter here; correctness,
# mastery, template seeds, reviews and XP are covered by `pnpm acceptance m06` and the API tests.
# Prereqs: as m01-identity.yaml (development build on an emulator, local Supabase + functions with
# the Toán 2 library imported, `pnpm dev:mobile`). Uses the LOCAL test OTP number 0900000002 /
# 123456 (supabase/config.toml). Read-aloud needs a device with a Vietnamese TTS voice; Maestro
# cannot hear it, so check it by ear on the device.
# Run: maestro test apps/mobile/.maestro/m06-practice.yaml
appId: vn.vionx.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Phụ huynh'
    timeout: 60000
- tapOn:
    id: 'role-parent'
- tapOn:
    id: 'phone-input'
- inputText: '0900000002'
- tapOn:
    id: 'send-code'
- extendedWaitUntil:
    visible:
      id: 'otp-input'
    timeout: 15000
- tapOn:
    id: 'otp-input'
- inputText: '123456'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'verify-code'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'verify-code'
- extendedWaitUntil:
    visible: 'Thêm con|Tạo gia đình|Đồng ý và tiếp tục|Đang hoạt động|Cần đồng ý.*'
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'policies-accept'
    commands:
      - extendedWaitUntil:
          notVisible: 'Đang tải…'
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: 'policies-agree'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'policies-agree'
      - extendedWaitUntil:
          notVisible: 'Đang tải…'
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: 'policies-accept'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'policies-accept'
- extendedWaitUntil:
    visible: 'Thêm con|Tạo gia đình|Đang hoạt động|Cần đồng ý.*'
    timeout: 20000
- runFlow:
    when:
      visible: 'Tạo gia đình'
    commands:
      - extendedWaitUntil:
          notVisible: 'Đang tải…'
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: 'household-name'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'household-name'
      - inputText: 'Gia đình Luyện tập'
      - extendedWaitUntil:
          notVisible: 'Đang tải…'
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: 'household-create'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'household-create'
- extendedWaitUntil:
    visible:
      id: 'screen-parent-home-settled'
    timeout: 90000

# A grade-2 child for this run
- runFlow:
    file: subflows/m01-add-child.yaml
    env:
      NAME: 'Na'
      YEAR: '2018'
      GRADE: '2'
      PIN: '2580'
- evalScript: ${output.loginId = maestro.copiedText}

# Child device
- extendedWaitUntil:
    visible:
      id: 'screen-parent-home-settled'
    timeout: 90000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'child-device'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-device'
- tapOn: 'Tiếp tục'
- extendedWaitUntil:
    visible:
      id: 'child-login-id'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'child-login-id'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-login-id'
- inputText: ${output.loginId}
- runFlow:
    file: subflows/m01-enter-pin.yaml
    env:
      DIGITS: '2,5,8,0'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'child-login-submit'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-login-submit'
- extendedWaitUntil:
    visible:
      id: 'open-learn'
    timeout: 15000

# Learn → knowledge map → first topic
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'open-learn'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'open-learn'
- extendedWaitUntil:
    visible:
      id: 'screen-learn'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'subject-math'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'subject-math'
- takeScreenshot: m06-knowledge-map
- tapOn: 'Làm bài kiểm tra đầu vào'
- extendedWaitUntil:
    visible:
      id: 'item-stem'
    timeout: 20000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'speak-item'
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-progress'
    direction: DOWN
    timeout: 60000
- takeScreenshot: m06-first-item

# Hint ladder and report on the first item
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-hint'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-hint'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'practice-hint'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'hint-1'
    direction: UP
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-report'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-report'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'practice-report'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'report-UNCLEAR'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'report-UNCLEAR'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'report-sent'
    direction: DOWN
    timeout: 60000

# Answer up to 12 items with taps only, whatever their type
- repeat:
    while:
      notVisible:
        id: 'practice-summary'
    times: 14
    commands:
      - scrollUntilVisible:
          element:
            id: 'item-stem'
          direction: UP
          optional: true
      - extendedWaitUntil:
          notVisible: 'Đang tải…'
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: 'speak-item'
          direction: DOWN
          timeout: 60000
      # choice, picture choice, spelling, multi choice, word bank, ordering (tap each in turn)
      - scrollUntilVisible:
          element:
            id: 'option-a'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'option-a'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'option-b'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'option-b'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'option-c'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'option-c'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'option-d'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'option-d'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'option-true'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'option-true'
          optional: true
      # numeric: the on-screen pad
      - scrollUntilVisible:
          element:
            id: 'key-5'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'key-5'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'practice-submit'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'practice-submit'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'practice-submit'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'practice-continue'
          timeout: 15000
          optional: true
      - scrollUntilVisible:
          element:
            id: 'practice-continue'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'practice-continue'
          optional: true
      # an item the taps above could not complete (matching, typing): stop the session
      - runFlow:
          when:
            notVisible:
              id: 'practice-summary'
            visible:
              id: 'practice-submit'
              enabled: false
          commands:
            - extendedWaitUntil:
                notVisible: 'Đang tải…'
                timeout: 60000
            - scrollUntilVisible:
                element:
                  id: 'practice-finish'
            - extendedWaitUntil:
                notVisible: 'Đang tải…'
                timeout: 60000
            - scrollUntilVisible:
                element:
                  id: 'practice-finish'
                direction: DOWN
                timeout: 60000
            - tapOn:
                id: 'practice-finish'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'summary-score'
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'summary-xp'
    direction: DOWN
    timeout: 60000
- takeScreenshot: m06-summary
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-done'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-done'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'practice-done'
- extendedWaitUntil:
    visible:
      id: 'screen-learn'
    timeout: 15000
