# M08, Master Spec §43, CHILD device (emulator 2 of 2). Run after m08-parent.yaml:
#   maestro --device <child> test -e LOGIN_ID=<vx-…> apps/mobile/.maestro/m08-child.yaml
# The child signs in with the Child ID and PIN 2580, sees Today, completes the parent's task and
# one practice session started from a Today card.
appId: vn.vionx.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Con'
    timeout: 60000
- tapOn:
    id: 'role-child'
- extendedWaitUntil:
    visible:
      id: 'child-login-id'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'child-login-id'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-login-id'
- inputText: ${LOGIN_ID}
- runFlow:
    file: subflows/m01-enter-pin.yaml
    env:
      DIGITS: '2,5,8,0'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'child-login-submit'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-login-submit'
- extendedWaitUntil:
    visible:
      id: 'today-now'
    timeout: 20000
- assertVisible: 'Bai tap Toan'
- takeScreenshot: m08-child-today

# The parent's task
- tapOn: 'Con làm xong rồi!'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'today-message'
    direction: DOWN
    timeout: 60000

# One practice session from a Today card
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element: 'Bắt đầu'
- tapOn:
    text: 'Bắt đầu'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'item-stem'
    timeout: 20000
- repeat:
    while:
      notVisible:
        id: 'practice-summary'
    times: 17
    commands:
      - scrollUntilVisible:
          element:
            id: 'option-a'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'option-a'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'option-true'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'option-true'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'key-5'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'key-5'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'practice-submit'
          optional: true
      - scrollUntilVisible:
          element:
            id: 'practice-submit'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'practice-submit'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'practice-continue'
          timeout: 15000
          optional: true
      - scrollUntilVisible:
          element:
            id: 'practice-continue'
          direction: DOWN
          timeout: 3000
          optional: true
      - tapOn:
          id: 'practice-continue'
          optional: true
      - runFlow:
          when:
            notVisible:
              id: 'practice-summary'
            visible:
              id: 'practice-submit'
              enabled: false
          commands:
            - extendedWaitUntil:
                notVisible: 'Đang tải…'
                timeout: 60000
            - scrollUntilVisible:
                element:
                  id: 'practice-finish'
            - extendedWaitUntil:
                notVisible: 'Đang tải…'
                timeout: 60000
            - scrollUntilVisible:
                element:
                  id: 'practice-finish'
                direction: DOWN
                timeout: 60000
            - tapOn:
                id: 'practice-finish'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'summary-xp'
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-done'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'practice-done'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'practice-done'
- extendedWaitUntil:
    visible:
      id: 'screen-child-home'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'today-done'
- takeScreenshot: m08-child-today-done
