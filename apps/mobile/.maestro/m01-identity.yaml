# M01 main path: parent OTP → household → 3 children → child login → 5 wrong PINs lock →
# parent resets PIN → child login OK.
# Prereqs: development build on an emulator, `pnpm db:start && pnpm fn:serve` on the host,
# apps/mobile/.env.local with EXPO_PUBLIC_SUPABASE_ANON_KEY, `pnpm dev:mobile` running.
# Uses the LOCAL test OTP number 0900000003 / 123456 (supabase/config.toml). Repeatable: an
# existing household is reused and three more children are added.
# Run: maestro test apps/mobile/.maestro/m01-identity.yaml
appId: vn.vionx.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Phụ huynh'
    timeout: 60000

# Parent signs in with phone OTP
- tapOn:
    id: 'role-parent'
- tapOn:
    id: 'phone-input'
- inputText: '0900000003'
- tapOn:
    id: 'send-code'
- extendedWaitUntil:
    visible:
      id: 'otp-input'
    timeout: 15000
- tapOn:
    id: 'otp-input'
- inputText: '123456'
- tapOn:
    id: 'verify-code'

# Privacy policy & terms (M02; first sign-in or after a re-consent version)
- extendedWaitUntil:
    visible: 'Thêm con|Tạo gia đình|Đồng ý và tiếp tục'
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'policies-accept'
    commands:
      - tapOn:
          id: 'policies-agree'
      - tapOn:
          id: 'policies-accept'

# Household (first run only)
- extendedWaitUntil:
    visible: 'Thêm con|Tạo gia đình'
    timeout: 20000
- runFlow:
    when:
      visible: 'Tạo gia đình'
    commands:
      - tapOn:
          id: 'household-name'
      - inputText: 'Gia đình Maestro'
      - tapOn:
          id: 'household-create'
- extendedWaitUntil:
    visible:
      id: 'add-child'
    timeout: 15000

# Three children (grades 2, 6, 9); the last one gets a known PIN for the child login below
- runFlow:
    file: subflows/m01-add-child.yaml
    env:
      NAME: 'Bé Hai'
      YEAR: '2019'
      GRADE: '2'
      PIN: ''
- runFlow:
    file: subflows/m01-add-child.yaml
    env:
      NAME: 'Sáu'
      YEAR: '2014'
      GRADE: '6'
      PIN: ''
- runFlow:
    file: subflows/m01-add-child.yaml
    env:
      NAME: 'Chín'
      YEAR: '2011'
      GRADE: '9'
      PIN: '2580'
# m01-add-child leaves the grade-9 child's login id in maestro.copiedText
- evalScript: ${output.loginId = maestro.copiedText}
- takeScreenshot: m01-children

# Switch this phone to child-device mode (signs the parent out here)
- tapOn:
    id: 'child-device'
- tapOn: 'Tiếp tục'
- extendedWaitUntil:
    visible:
      id: 'child-login-id'
    timeout: 15000

# Child signs in with ID + PIN
- tapOn:
    id: 'child-login-id'
- inputText: ${output.loginId}
- runFlow:
    file: subflows/m01-enter-pin.yaml
    env:
      DIGITS: '2,5,8,0'
- tapOn:
    id: 'child-login-submit'
- extendedWaitUntil:
    visible: 'Xin chào, Chín!'
    timeout: 15000
- takeScreenshot: m01-child-home
- tapOn:
    id: 'child-sign-out'

# 5 wrong PINs lock the login (the ID is remembered on this device)
- extendedWaitUntil:
    visible:
      id: 'remembered-login-id'
    timeout: 15000
- repeat:
    times: 5
    commands:
      - runFlow:
          file: subflows/m01-enter-pin.yaml
          env:
            DIGITS: '0,0,0,0'
      - tapOn:
          id: 'child-login-submit'
      - extendedWaitUntil:
          visible:
            id: 'child-login-error'
          timeout: 10000
- assertVisible: 'Nhập sai quá nhiều lần.*'
- takeScreenshot: m01-locked

# Parent resets the PIN
- tapOn:
    id: 'child-login-parent'
- tapOn:
    id: 'phone-input'
- inputText: '0900000003'
- tapOn:
    id: 'send-code'
- extendedWaitUntil:
    visible:
      id: 'otp-input'
    timeout: 20000
- tapOn:
    id: 'otp-input'
- inputText: '123456'
- tapOn:
    id: 'verify-code'
- extendedWaitUntil:
    visible:
      id: 'student-${output.loginId}'
    timeout: 20000
- tapOn:
    id: 'student-${output.loginId}'
- assertVisible: 'Đang bị khoá.*'
- tapOn:
    id: 'new-pin'
- inputText: '1357'
- hideKeyboard
- tapOn:
    id: 'reset-pin'
- tapOn: 'Tiếp tục'
- extendedWaitUntil:
    visible:
      id: 'credential-card'
    timeout: 15000
- assertVisible:
    id: 'credential-pin'
    text: '1357'
- tapOn:
    id: 'credentials-done'

# Child signs in with the new PIN
- tapOn:
    id: 'child-device'
- tapOn: 'Tiếp tục'
- extendedWaitUntil:
    visible:
      id: 'remembered-login-id'
    timeout: 15000
- runFlow:
    file: subflows/m01-enter-pin.yaml
    env:
      DIGITS: '1,3,5,7'
- tapOn:
    id: 'child-login-submit'
- extendedWaitUntil:
    visible: 'Xin chào, Chín!'
    timeout: 15000
- takeScreenshot: m01-child-after-reset
