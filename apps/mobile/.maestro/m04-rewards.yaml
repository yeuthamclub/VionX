# M04 main path: parent sets the reward rules (system caps shown; a cap above them is refused, a lower
# one is saved) and adds a catalog reward → creates a SELF_CHECK task worth XP → the child completes
# it on a child device and sees the XP, level, Coin and today's cap bar in the wallet, and the reward
# in the catalog. Coin are credited at the end of the household day (pg_cron), so redemption and its
# approval are covered by `pnpm acceptance m04` and the API tests rather than on the device.
# Prereqs: as m01-identity.yaml (development build on an emulator, local Supabase + functions,
# `pnpm dev:mobile`). Uses the LOCAL test OTP number 0900000004 / 123456 (supabase/config.toml).
# Run: maestro test apps/mobile/.maestro/m04-rewards.yaml
appId: vn.vionx.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Phụ huynh'
    timeout: 60000
- tapOn:
    id: 'role-parent'
- tapOn:
    id: 'phone-input'
- inputText: '0900000004'
- tapOn:
    id: 'send-code'
- extendedWaitUntil:
    visible:
      id: 'otp-input'
    timeout: 15000
- tapOn:
    id: 'otp-input'
- inputText: '123456'
- scrollUntilVisible:
    element:
      id: 'verify-code'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'verify-code'
- extendedWaitUntil:
    visible: 'Thêm con|Tạo gia đình|Đồng ý và tiếp tục|Đang hoạt động|Cần đồng ý.*'
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'policies-accept'
    commands:
      - scrollUntilVisible:
          element:
            id: 'policies-agree'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'policies-agree'
      - scrollUntilVisible:
          element:
            id: 'policies-accept'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'policies-accept'
- extendedWaitUntil:
    visible: 'Thêm con|Tạo gia đình|Đang hoạt động|Cần đồng ý.*'
    timeout: 20000
- runFlow:
    when:
      visible: 'Tạo gia đình'
    commands:
      - scrollUntilVisible:
          element:
            id: 'household-name'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'household-name'
      - inputText: 'Gia đình Thưởng'
      - scrollUntilVisible:
          element:
            id: 'household-create'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'household-create'
- extendedWaitUntil:
    visible:
      id: 'screen-parent-home-settled'
    timeout: 90000

# A grade-6 child for this run
- runFlow:
    file: subflows/m01-add-child.yaml
    env:
      NAME: 'Minh'
      YEAR: '2014'
      GRADE: '6'
      PIN: '2580'
- evalScript: ${output.loginId = maestro.copiedText}

# Parent: child → rewards → rules editor (system caps visible)
- extendedWaitUntil:
    visible:
      id: 'screen-parent-home-settled'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'student-${output.loginId}'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'student-${output.loginId}'
- scrollUntilVisible:
    element:
      id: 'open-rewards'
- scrollUntilVisible:
    element:
      id: 'open-rewards'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'open-rewards'
- extendedWaitUntil:
    visible:
      id: 'wallet-card'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'open-reward-rules'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'open-reward-rules'
- extendedWaitUntil:
    visible: '.*Tối đa hệ thống: 20.*'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'rules-weekdayCapCoins'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'rules-weekdayCapCoins'
- eraseText
- inputText: '25'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'rules-save'
- scrollUntilVisible:
    element:
      id: 'rules-save'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'rules-save'
- scrollUntilVisible:
    element: 'Không được cao hơn 20'
    direction: UP
- scrollUntilVisible:
    element:
      id: 'rules-weekdayCapCoins'
    direction: UP
- scrollUntilVisible:
    element:
      id: 'rules-weekdayCapCoins'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'rules-weekdayCapCoins'
- eraseText
- inputText: '15'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'rules-save'
- scrollUntilVisible:
    element:
      id: 'rules-save'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'rules-save'
- extendedWaitUntil:
    visible:
      id: 'rules-message'
    timeout: 15000
- takeScreenshot: m04-rules
- back

# Catalog: add a reward
- scrollUntilVisible:
    element:
      id: 'open-reward-catalog'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'open-reward-catalog'
- extendedWaitUntil:
    visible:
      id: 'catalog-add'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'catalog-add'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'catalog-add'
- scrollUntilVisible:
    element:
      id: 'catalog-title'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'catalog-title'
- inputText: '30 phút xem hoạt hình'
- scrollUntilVisible:
    element:
      id: 'catalog-cost'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'catalog-cost'
- inputText: '5'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'catalog-icon-screen'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'catalog-icon-screen'
- scrollUntilVisible:
    element:
      id: 'catalog-save'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'catalog-save'
- extendedWaitUntil:
    visible: '.*30 phút xem hoạt hình.*'
    timeout: 15000
- takeScreenshot: m04-catalog
- back
- back

# A SELF_CHECK task worth 50 XP for today
- scrollUntilVisible:
    element:
      id: 'open-calendar'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'open-calendar'
- extendedWaitUntil:
    visible:
      id: 'add-task'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'add-task'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'add-task'
- extendedWaitUntil:
    visible:
      id: 'task-title'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'task-title'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'task-title'
- inputText: 'Luyện tiếng Anh'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'verification-SELF_CHECK'
- scrollUntilVisible:
    element:
      id: 'verification-SELF_CHECK'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'verification-SELF_CHECK'
- scrollUntilVisible:
    element:
      id: 'task-xp'
- scrollUntilVisible:
    element:
      id: 'task-xp'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'task-xp'
- eraseText
- inputText: '50'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'task-save'
- scrollUntilVisible:
    element:
      id: 'task-save'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'task-save'
- extendedWaitUntil:
    visible: 'Luyện tiếng Anh'
    timeout: 15000
- back
- back

# Child device: complete the task, then the wallet and the rewards
- extendedWaitUntil:
    visible:
      id: 'screen-parent-home-settled'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'child-device'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-device'
- tapOn: 'Tiếp tục'
- extendedWaitUntil:
    visible:
      id: 'child-login-id'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'child-login-id'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-login-id'
- inputText: ${output.loginId}
- runFlow:
    file: subflows/m01-enter-pin.yaml
    env:
      DIGITS: '2,5,8,0'
- scrollUntilVisible:
    element:
      id: 'child-login-submit'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-login-submit'
- extendedWaitUntil:
    visible:
      id: 'open-child-tasks'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'open-child-tasks'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'open-child-tasks'
- extendedWaitUntil:
    visible: 'Luyện tiếng Anh'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'complete-.*'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'complete-.*'
- extendedWaitUntil:
    visible:
      id: 'child-tasks-message'
    timeout: 15000
- back
# The worker grants XP within a minute (pg_cron tick).
- scrollUntilVisible:
    element:
      id: 'open-child-wallet'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'open-child-wallet'
- extendedWaitUntil:
    visible:
      id: 'wallet-card'
    timeout: 15000
- repeat:
    while:
      notVisible: 'Tổng 50 XP'
    times: 12
    commands:
      - back
      - scrollUntilVisible:
          element:
            id: 'open-child-wallet'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'open-child-wallet'
      - extendedWaitUntil:
          visible:
            id: 'wallet-card'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible: 'Tổng 50 XP'
- scrollUntilVisible:
    element:
      id: 'wallet-cap-bar'
    direction: DOWN
    timeout: 60000
- assertVisible: '.*50/1500 XP.*'
- takeScreenshot: m04-wallet
- scrollUntilVisible:
    element:
      id: 'open-child-rewards'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'open-child-rewards'
- extendedWaitUntil:
    visible: '.*30 phút xem hoạt hình.*'
    timeout: 15000
- assertVisible: 'Cần thêm 5 Coin'
- takeScreenshot: m04-child-rewards
