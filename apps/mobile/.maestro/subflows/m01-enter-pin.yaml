# Sub-flow: clear the PIN pad and tap the digits in DIGITS (comma-separated, 4 digits).
appId: vn.vionx.app
---
- tapOn:
    id: 'pin-key-clear'
- evalScript: ${output.pin = DIGITS.split(',')}
- tapOn:
    id: 'pin-key-${output.pin[0]}'
- tapOn:
    id: 'pin-key-${output.pin[1]}'
- tapOn:
    id: 'pin-key-${output.pin[2]}'
- tapOn:
    id: 'pin-key-${output.pin[3]}'
