# Sub-flow: add one child from the parent home, grant CORE_SERVICE and the separate
# CROSS_BORDER_TRANSFER consent, check the credential
# card, return home.
# env: NAME, YEAR, GRADE, PIN ('' = generated). Leaves the login id in maestro.copiedText.
appId: vn.vionx.app
---
- extendedWaitUntil:
    visible:
      id: 'screen-parent-home-settled'
    timeout: 90000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'add-child'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'add-child'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'child-name'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-name'
- inputText: ${NAME}
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'child-birth-year'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-birth-year'
- inputText: ${YEAR}
- hideKeyboard
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'grade-${GRADE}'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'grade-${GRADE}'
- runFlow:
    when:
      true: ${PIN != ''}
    commands:
      - extendedWaitUntil:
          notVisible: 'Đang tải…'
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: 'child-pin'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'child-pin'
      - inputText: ${PIN}
      - hideKeyboard
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'child-create'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'child-create'
# M02: the parent grants CORE_SERVICE and, as its own step, CROSS_BORDER_TRANSFER before the
# credentials are shown
- extendedWaitUntil:
    visible:
      id: 'screen-consents'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'grant-CORE_SERVICE'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'grant-CORE_SERVICE'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'revoke-CORE_SERVICE'
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'grant-CROSS_BORDER_TRANSFER'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'grant-CROSS_BORDER_TRANSFER'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'revoke-CROSS_BORDER_TRANSFER'
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'consent-continue'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'consent-continue'
- extendedWaitUntil:
    visible:
      id: 'credential-card'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'credential-login-id'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'credential-login-id'
    text: 'vx-[2-9a-hjkmnp-z]{6}'
- copyTextFrom:
    id: 'credential-login-id'
- extendedWaitUntil:
    notVisible: 'Đang tải…'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'credentials-done'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'credentials-done'
- extendedWaitUntil:
    visible:
      id: 'screen-parent-home-settled'
    timeout: 90000
