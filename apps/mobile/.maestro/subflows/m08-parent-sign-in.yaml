# Sub-flow: parent signs in with a test OTP number and lands on the parent home (creating the
# household on the first run). env: PHONE, HOUSEHOLD.
appId: vn.vionx.app
---
- extendedWaitUntil:
    visible: 'Phụ huynh'
    timeout: 60000
- tapOn:
    id: 'role-parent'
- tapOn:
    id: 'phone-input'
- inputText: ${PHONE}
- tapOn:
    id: 'send-code'
- extendedWaitUntil:
    visible:
      id: 'otp-input'
    timeout: 15000
- tapOn:
    id: 'otp-input'
- inputText: '123456'
- scrollUntilVisible:
    element:
      id: 'verify-code'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'verify-code'
- extendedWaitUntil:
    visible: 'Thêm con|Tạo gia đình|Đồng ý và tiếp tục|Đang hoạt động|Cần đồng ý.*'
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'policies-accept'
    commands:
      - scrollUntilVisible:
          element:
            id: 'policies-agree'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'policies-agree'
      - scrollUntilVisible:
          element:
            id: 'policies-accept'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'policies-accept'
- extendedWaitUntil:
    visible: 'Thêm con|Tạo gia đình|Đang hoạt động|Cần đồng ý.*'
    timeout: 20000
- runFlow:
    when:
      visible: 'Tạo gia đình'
    commands:
      - scrollUntilVisible:
          element:
            id: 'household-name'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'household-name'
      - inputText: ${HOUSEHOLD}
      - scrollUntilVisible:
          element:
            id: 'household-create'
          direction: DOWN
          timeout: 60000
      - tapOn:
          id: 'household-create'
- extendedWaitUntil:
    visible:
      id: 'screen-parent-home-settled'
    timeout: 90000
